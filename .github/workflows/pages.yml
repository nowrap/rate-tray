name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/*.png'
      - 'src/RateTray/app.ico'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run replaces a pending one rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The screenshots and icon live with the app, not with the site, so there is one place
      # to regenerate them (tools/New-Screenshots.ps1) and no second copy to keep in step.
      - name: Assemble
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp docs/details.png docs/details.de.png docs/tray-icons.png _site/
          cp docs/settings.png docs/settings.de.png _site/
          cp docs/settings-colors.png docs/settings-colors.de.png _site/
          cp docs/social.png docs/apple-touch-icon.png _site/
          cp src/RateTray/app.ico _site/favicon.ico

      # Every image is copied in above rather than committed, so a page referencing a file
      # nobody remembered to copy would 404 in silence. Fail the build instead.
      - name: Check local references resolve
        working-directory: _site
        run: |
          missing=0
          for page in $(find . -name '*.html'); do
            dir=$(dirname "$page")
            for ref in $(grep -oE '(src|href)="[^"#]+"' "$page" | sed -E 's/^[a-z]+="//; s/"$//'); do
              case "$ref" in http*|mailto:*|*/) continue;; esac
              if [ ! -e "$dir/$ref" ]; then
                echo "missing: ${page#./} -> $ref"
                missing=1
              fi
            done
          done
          exit $missing

      # RFC 9116 requires an Expires date, and a security.txt past it is worse than none: it
      # advertises a contact nobody is watching. Nothing renews it automatically, so the deploy
      # is what enforces it — with two weeks of warning, which is long enough to edit one line.
      - name: Check security.txt has not expired
        working-directory: _site
        run: |
          expires=$(sed -n 's/^[Ee]xpires:[[:space:]]*//p' .well-known/security.txt | head -1 | tr -d '\r')
          if [ -z "$expires" ]; then
            echo "::error::security.txt has no Expires field"
            exit 1
          fi
          days=$(( ( $(date -u -d "$(echo "$expires" | sed 's/\.[0-9]*Z$/Z/')" +%s) - $(date -u +%s) ) / 86400 ))
          echo "security.txt expires in $days days ($expires)"
          if [ "$days" -lt 14 ]; then
            echo "::error::security.txt expires in $days days — set a new Expires in site/.well-known/security.txt"
            exit 1
          fi

      # security.txt names a fingerprint and hosts the key it belongs to. Nothing at runtime
      # notices when the two drift apart — a reporter just encrypts to the wrong key, or to one
      # that has expired, and the report never arrives readable. So compare them here.
      - name: Check the published PGP key matches security.txt
        working-directory: _site
        run: |
          info=$(gpg --with-colons --import-options show-only --import .well-known/pgp-key.txt)
          declared=$(sed -n 's/^[Ee]ncryption:[[:space:]]*openpgp4fpr://p' .well-known/security.txt | head -1 | tr -d '\r')
          published=$(echo "$info" | awk -F: '$1=="fpr"{print tolower($10); exit}')
          if [ "$declared" != "$published" ]; then
            echo "::error::security.txt names openpgp4fpr:$declared but pgp-key.txt holds $published"
            exit 1
          fi
          expiry=$(echo "$info" | awk -F: '$1=="pub"{print $7; exit}')
          days=$(( ( expiry - $(date -u +%s) ) / 86400 ))
          echo "pgp-key.txt $published expires in $days days"
          if [ "$days" -lt 14 ]; then
            echo "::error::the published PGP key expires in $days days — publish a new one"
            exit 1
          fi

      # include-hidden-files defaults to false in v5, which tars the site with
      # `--exclude=.[^/]*` and silently drops .well-known — where RFC 9116 requires
      # security.txt to live. Every check above passes regardless, because they all run
      # against _site rather than against what is actually served.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # The checks in build all inspect _site, so none of them can see a file the upload step
      # threw away — which is how .well-known went missing once with the build still green.
      # Ask the deployed site instead: it is the only source that cannot be wrong.
      - name: Check the security contact is served
        run: |
          for path in .well-known/security.txt .well-known/pgp-key.txt; do
            url="${{ steps.deployment.outputs.page_url }}$path"
            for attempt in 1 2 3 4 5; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' "$url" || echo 000)
              [ "$code" = "200" ] && break
              echo "$path: HTTP $code (attempt $attempt)"
              sleep 10
            done
            if [ "$code" != "200" ]; then
              echo "::error::$url is not served (HTTP $code)"
              exit 1
            fi
            echo "$path: HTTP 200"
          done
