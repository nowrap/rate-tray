name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Derive version from the tag
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.event.inputs.tag }}'
          if (-not $tag) { $tag = '${{ github.ref_name }}' }
          $version = $tag.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "tag '$tag' is not vMAJOR.MINOR.PATCH" }
          "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Test
        run: |
          dotnet test tests/RateTray.Tests/RateTray.Tests.csproj --configuration Release
          dotnet test tests/RateTray.E2E/RateTray.E2E.csproj --configuration Release

      # Framework-dependent: a self-contained build would be ~70 MB, and the .NET 9 Desktop
      # Runtime is already present on most machines that run either CLI.
      - name: Publish
        run: >
          dotnet publish src/RateTray/RateTray.csproj
          --configuration Release --runtime win-x64
          -p:Version=${{ steps.version.outputs.version }}
          --output publish

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/RateTray.exe -Algorithm SHA256).Hash
          "$hash  RateTray.exe" | Out-File -FilePath publish/SHA256SUMS.txt -Encoding ascii

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            publish/RateTray.exe
            publish/SHA256SUMS.txt
          body: |
            Requires the [.NET 9 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/9.0).

            Verify the download:

            ```powershell
            Get-FileHash RateTray.exe -Algorithm SHA256
            ```
